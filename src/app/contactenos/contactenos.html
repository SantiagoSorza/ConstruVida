<app-header></app-header>
<main class="contact-page">

  <section class="hero hero--center">
    <div class="hero__bg">
      <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1400&q=80" alt="Contacto" class="hero__imgCont" />
      <div class="hero__overlay"></div>
    </div>

    <div class="hero__content hero__content--center">
      <h1 class="hero__title">Contáctanos</h1>
      <h1 class="hero__subtitle">Nos ocupamos de tus trámites ante EPS, ARL, pensiones y demás entidades. Escríbenos y te orientamos.</h1>
    </div>
  </section>

  <section class="card__whatsapp">
    <div class="card__whatsapp__container">
      <div class="card__whatsapp__card" role="region" aria-labelledby="card__whatsapp__title">
        <h3 id="card__whatsapp__title">Solicita tu cotización gratuita</h3>

        <div class="card__whatsapp__image-container">
          <img src="assets/img/pngwing.com.png" alt="WhatsApp contacto" class="card__whatsapp__image">
        </div>

        <p class="card__whatsapp__text">Contáctanos directamente por WhatsApp y recibe atención personalizada de inmediato. Déjanos tu nombre y tu consulta.</p>

        <a
          [href]="whatsappLink"
          target="_blank"
          class="btn btn--primary hero__cta"
          aria-label="Chatear por WhatsApp para solicitar cotización"
        >
          Enviar y chatear por WhatsApp
          <img class="external-icon-btn" src="assets/img/blanco.png" alt="Enlace externo">
        </a>
      </div>
    </div>
  </section>
     
</main>

<app-footer></app-footer>
