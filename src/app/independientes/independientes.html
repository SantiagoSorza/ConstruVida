<app-header></app-header>

<main role="main">
<div class="page-container">


  <section class="hero hero--left">
    <div class="hero__bg">
      <img src="https://img.freepik.com/foto-gratis/hombre-atractivo-hipster-usando-dispositivos-trabajando-computadora-portatil-tableta_285396-1630.jpg?semt=ais_hybrid&w=740&q=80" alt="Banner" class="hero__img">
      <div class="hero__overlay"></div>
    </div>

    <div class="hero__content hero__content--left">
      <h1 class="hero__title">Motivos o ventajas de afiliarse como independiente</h1>
      <a class="btn btn--primary hero__cta" [href]="whatsappLink" target="_blank">¿Quieres cotizar?
        <img class="external-icon-btn" src="assets/img/blanco.png" alt="Enlace externo">
      </a>
      </div>
  </section>

    <section class="section">
        <h2 class="section-title">EPS DISPONIBLES</h2>
        <p class="section-subtitle">Aquí puedes ver la lista de EPS habilitadas.</p>

    <div class="grid grid--auto">
      <article *ngFor="let item of paginatedCards; let i = index" class="card" role="article" [attr.aria-labelledby]="'card-' + i">
        <div class="card__image">
          <a [href]="getItemWhatsAppLink(item, 'eps')" target="_blank" rel="noopener noreferrer" aria-label="Enviar mensaje por WhatsApp para afiliarme a la EPS {{item.title}}">
            <img [src]="item.image" [alt]="'Imagen del proyecto: ' + item.title" class="card__img">
            <span *ngIf="(item.url) && (item.url).indexOf('http') === 0" class="external-badge" aria-hidden="true">
              <img src="assets/img/enlace.png" alt="Enlace externo" width="18" height="18">
            </span>
          </a>
        </div>
        <div class="card__content">
          <h3 [id]="'card-' + i" class="card__title">
            <a
              [href]="getItemWhatsAppLink(item, 'eps')"
              target="_blank"
              rel="noopener noreferrer"
              [attr.aria-label]="'Enviar mensaje por WhatsApp para afiliarme a la EPS ' + item.title"
            >
              {{item.title}}
              <img *ngIf="(item.url) && (item.url).indexOf('http') === 0" class="external-icon" src="assets/img/enlace.png" alt="Enlace externo" width="14" height="14">
            </a>
          </h3>
        </div>
      </article>
    </div>

    <nav class="pagination" role="navigation" aria-label="Paginación de proyectos">
      <button 
        class="pagination__btn pagination__btn--prev" 
        (click)="prevPage()" 
        [disabled]="currentPage === 1"
        aria-label="Página anterior"
      >
        ‹
      </button>
      
      <div class="pagination__dots">
        <button 
          *ngFor="let page of pages" 
          class="pagination__btn" 
          [class.is-active]="page === currentPage"
          (click)="goToPage(page)"
          [attr.aria-label]="'Ir a página ' + page"
          [attr.aria-current]="page === currentPage ? 'page' : null"
        >
          {{page}}
        </button>
      </div>
      
      <button 
        class="pagination__btn pagination__btn--next" 
        (click)="nextPage()" 
        [disabled]="currentPage === totalPages"
        aria-label="Página siguiente"
      >
        ›
      </button>
    </nav>
    </section>
    <section class="curved-section">
      <div class="curved__content">
      <img src="https://www.iadb.org/sites/default/files/styles/landscape_2x1_768000_768x384_100/public/2023-10/Retirees-Banner-IDB-Social-development.jpg?h=fd3efce3&itok=ELuAWQXX " alt="Asistencia en línea" class="curved__imgInde">
      <div class="curved__overlay"></div>
        </div>
    </section>

    <section class="section section--gray">
      <div>
        <h2 class="section-title">Pensiones disponibles</h2>
        <div class="grid grid--auto">
      <article *ngFor="let item of paginatedCardsP; let i = index" class="card" role="article" [attr.aria-labelledby]="'card-' + i">
        <div class="card__image">
          <a [href]="getItemWhatsAppLink(item, 'pension')" target="_blank" rel="noopener noreferrer" aria-label="Enviar mensaje por WhatsApp para afiliarme a la pensión {{item.title}}">
            <img [src]="item.image" [alt]="'Imagen del proyecto: ' + item.title" class="card__img">
            <span *ngIf="(item.url) && (item.url).indexOf('http') === 0" class="external-badge" aria-hidden="true">
              <img src="assets/img/enlace.png" alt="Enlace externo" width="18" height="18">
            </span>
          </a>
        </div>
        <div class="card__content">
          <h3 [id]="'card-' + i" class="card__title">
            <a
             [href]="getItemWhatsAppLink(item, 'pension')"
             target="_blank"
             rel="noopener noreferrer"
             [attr.aria-label]="'Enviar mensaje por WhatsApp para afiliarme a la pensión: ' + item.title">
              {{item.title}}
              <img *ngIf="(item.url) && (item.url).indexOf('http') === 0" class="external-icon" src="assets/img/enlace.png" alt="Enlace externo" width="14" height="14">
            </a>
          </h3>
        </div>
      </article>
    </div>

    <nav class="pagination" role="navigation" aria-label="Paginación de proyectos">
      <button 
        class="pagination__btn pagination__btn--prev" 
        (click)="prevPageP()" 
        [disabled]="currentPageP === 1"
        aria-label="Página anterior"
      >
        ‹
      </button>
      
      <div class="pagination__dots">
        <button 
          *ngFor="let pageP of pagesP" 
          class="pagination__btn" 
          [class.is-active]="pageP === currentPageP"
          (click)="goToPageP(pageP)"
          [attr.aria-label]="'Ir a página ' + pageP"
          [attr.aria-current]="pageP === currentPageP ? 'page' : null"
        >
          {{pageP}}
        </button>
      </div>
      
      <button 
        class="pagination__btn pagination__btn--next" 
        (click)="nextPageP()" 
        [disabled]="currentPageP === totalPagesP"
        aria-label="Página siguiente"
      >
        ›
      </button>
    </nav>
      </div>
        
    </section>

    <section class="section">
      <h2 class="section-title">Requisitos para la afiliación</h2>

      <ul class="requirements-list">
        <li *ngFor="let req of requisitos">
          <span class="req-circle"></span>
          <span class="req-text">{{ req }}</span>
        </li>
      </ul>

      <div class="button-group">
        <a class="btn btn--primary hero__cta" [href]="whatsappLink" target="_blank">
          ¿Quieres cotizar?
          <img class="external-icon-btn" src="assets/img/blanco.png" alt="Enlace externo">
        </a>
      </div>
    </section>
</div>
</main>

<app-footer></app-footer>
